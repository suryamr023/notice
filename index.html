<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Notice Board | Live Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --urgent-gradient: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            --important-gradient: linear-gradient(135deg, #f59e0b 0%, #10b981 100%);
            
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --control-bg: #ffffff;
            --control-border: #cbd5e1;
            --control-text: #0f172a;
        }

        body.theme-night {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --control-bg: #1e293b;
            --control-border: #334155;
            --control-text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw; height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; color: var(--text-main);
            transition: background 1s ease, color 1s ease;
        }

        body {
            padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }

        .top-controls {
            position: fixed; top: 10px; right: 10px;
            display: flex; gap: 6px; z-index: 1000; align-items: center;
        }

        .control-btn, .live-clock {
            background: var(--control-bg); border: 1px solid var(--control-border);
            padding: 5px 10px; border-radius: 6px; font-size: 13px;
            font-weight: 700; color: var(--control-text); cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            transition: background 0.3s, color 0.3s;
        }
        .control-btn:hover { background: var(--primary); color: #ffffff !important; border-color: var(--primary); }

        .bg-glow {
            position: absolute; width: 250px; height: 250px;
            filter: blur(60px); border-radius: 50%; z-index: 0; opacity: 0.25;
        }
        .glow-1 { top: -50px; left: -50px; background: rgba(99, 102, 241, 0.4); }
        .glow-2 { bottom: -50px; right: -50px; background: rgba(236, 72, 153, 0.3); }

        .header-container { text-align: center; margin-top: 5px; margin-bottom: 5px; z-index: 2; flex-shrink: 0; }

        .board-title {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 800; background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--text-muted); font-size: clamp(0.7rem, 2vw, 0.85rem); font-weight: 600; }

        .slideshow-wrapper {
            max-width: 900px; width: 100%; margin: auto;
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 2; height: 75vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes urgentGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        }

        @keyframes importantGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.25); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
        }

        .notice-card {
            background: var(--card-bg); border-radius: 16px;
            padding: 18px; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.12);
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.6s ease, color 0.6s ease;
        }

        .notice-card.priority-urgent {
            animation: fadeIn 0.4s ease-out forwards, urgentGlow 2.5s infinite ease-in-out;
        }

        .notice-card.priority-important {
            animation: fadeIn 0.4s ease-out forwards, importantGlow 3s infinite ease-in-out;
        }

        .notice-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--primary-gradient);
            z-index: 3;
        }
        .notice-card.priority-important::before { background: var(--important-gradient); }
        .notice-card.priority-urgent::before { background: var(--urgent-gradient); }

        .pushpin {
            position: absolute; top: 12px; right: 15px; width: 14px; height: 14px;
            background: radial-gradient(circle, #fca5a5, #dc2626); border-radius: 50%; z-index: 4;
        }

        @keyframes badgeBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .priority-banner {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 10px; font-size: 0.68rem;
            font-weight: 800; text-transform: uppercase; margin-bottom: 6px; width: fit-content;
            animation: badgeBlink 1.5s infinite;
        }
        .banner-important { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
        .banner-urgent { background: #fee2e2; color: #b91c1c; border: 1px solid #ef4444; }

        .banner-container {
            width: 100%; height: 140px; border-radius: 8px; margin-bottom: 8px;
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: transparent; flex-shrink: 0;
        }
        .banner-container.has-blur { background: #090d16; }
        .banner-bg-fill {
            position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
            background-size: cover; background-position: center;
            filter: blur(16px) brightness(0.6); z-index: 1; display: none;
        }
        .banner-container.has-blur .banner-bg-fill { display: block; }
        .notice-img { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; border-radius: 4px; }

        .notice-content-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

        .notice-card h3 {
            font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 800; color: var(--text-main);
            margin-bottom: 6px; padding-right: 25px; line-height: 1.2; flex-shrink: 0;
            word-break: break-word; transition: color 0.6s ease;
        }

        .notice-body-content {
            color: var(--text-muted); font-size: clamp(0.8rem, 2vw, 0.95rem);
            line-height: 1.4; white-space: pre-wrap; word-break: break-word;
            overflow-y: auto !important; padding-right: 4px; flex-grow: 1;
            transition: color 0.6s ease;
        }
        .notice-body-content::-webkit-scrollbar { width: 3px; }
        .notice-body-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .notice-body-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 6px 0; object-fit: contain; }

        .notice-body-content table { width: 100% !important; border-collapse: collapse !important; margin: 6px 0 !important; }
        .notice-body-content th, .notice-body-content td { border: 1px solid var(--control-border) !important; padding: 4px !important; font-size: 0.78rem !important; }

        .notice-footer {
            margin-top: 8px; border-top: 1px solid var(--control-border); padding-top: 6px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0;
        }

        .author-badge {
            background: rgba(99, 102, 241, 0.15); color: var(--primary); padding: 2px 8px;
            border-radius: 10px; font-weight: 700; font-size: 0.7rem;
        }

        .progress-bar-container {
            width: 100%; height: 3px; background: rgba(100, 116, 139, 0.2);
            border-radius: 2px; margin-top: 6px; overflow: hidden; flex-shrink: 0;
        }
        .progress-bar { height: 100%; width: 0%; background: var(--primary-gradient); }

        .carousel-dots { display: flex; justify-content: center; gap: 4px; margin-top: 4px; flex-shrink: 0; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--control-border); }
        .dot.active { background: var(--primary); transform: scale(1.2); }

        .no-notice {
            text-align: center; padding: 20px; background: var(--card-bg);
            border-radius: 16px; max-width: 320px; margin: auto; color: var(--text-main);
        }

        .site-footer {
            text-align: center; padding: 4px 0 2px 0; font-size: 0.72rem;
            color: var(--text-muted); font-weight: 600; flex-shrink: 0; z-index: 2;
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <div class="live-clock" id="liveClock"></div>
        <button class="control-btn" onclick="window.toggleFullScreen()" id="fsBtn">⛶ Full</button>
    </div>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="header-container">
        <h1 class="board-title"><span>📢</span> Notice Board</h1>
        <p class="subtitle">Live System Broadcast</p>
    </div>
    
    <div class="slideshow-wrapper" id="slideshowWrapper"></div>

    <div>
        <div class="carousel-dots" id="carouselDots"></div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <footer class="site-footer">
        © 2026 Surya M R. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBeUXbdADiVfaoxpYULCx6jv9yj8p7klHI",
            authDomain: "notes-b78bf.firebaseapp.com",
            databaseURL: "https://notes-b78bf-default-rtdb.firebaseio.com",
            projectId: "notes-b78bf",
            storageBucket: "notes-b78bf.firebasestorage.app",
            messagingSenderId: "19853194702",
            appId: "1:19853194702:web:9603d20b0e6ec91684e79f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function updateThemeAutomatically() {
            const now = new Date();
            const currentTimeVal = now.getHours() * 60 + now.getMinutes();
            const isDayTime = currentTimeVal >= (6 * 60 + 8) && currentTimeVal < (18 * 60 + 19);
            if (isDayTime) document.body.classList.remove('theme-night');
            else document.body.classList.add('theme-night');
        }

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('liveClock');
            if (clockEl) clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            updateThemeAutomatically();
        }

        setInterval(updateClock, 1000);
        updateClock();

        let currentIndex = 0;
        let slideTimeout = null;
        let progressInterval = null;
        let autoScrollInterval = null;
        let progressWidth = 0;
        let globalNotices = [];

        onValue(ref(db, 'notices'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalNotices = Array.isArray(data) ? data : Object.values(data);
                localStorage.setItem('cachedNotices', JSON.stringify(globalNotices));
            } else {
                globalNotices = JSON.parse(localStorage.getItem('cachedNotices')) || [];
            }
            renderCurrentNotice();
        }, () => {
            globalNotices = JSON.parse(localStorage.getItem('cachedNotices')) || [];
            renderCurrentNotice();
        });

        function renderCurrentNotice() {
            const wrapper = document.getElementById('slideshowWrapper');
            const dotsContainer = document.getElementById('carouselDots');
            if (!wrapper || !dotsContainer) return;

            wrapper.innerHTML = '';
            dotsContainer.innerHTML = '';

            if (slideTimeout) clearTimeout(slideTimeout);
            if (progressInterval) clearInterval(progressInterval);
            if (autoScrollInterval) clearInterval(autoScrollInterval);

            progressWidth = 0;
            const progressBar = document.getElementById('progressBar');
            if (progressBar) progressBar.style.width = '0%';

            const priorityWeight = { urgent: 3, important: 2, normal: 1 };
            const visibleNotices = globalNotices
                .filter(notice => notice && !notice.hidden)
                .sort((a, b) => (priorityWeight[b.priority || 'normal'] || 1) - (priorityWeight[a.priority || 'normal'] || 1));

            if (visibleNotices.length === 0) {
                wrapper.innerHTML = `<div class="no-notice"><div style="font-size:2rem;">📭</div><h2>No Notices</h2></div>`;
                return;
            }

            if (currentIndex >= visibleNotices.length) currentIndex = 0;
            const notice = visibleNotices[currentIndex];
            const priority = notice.priority || 'normal';
            
            const card = document.createElement('div');
            card.className = `notice-card priority-${priority}`;
            
            card.innerHTML = `
                <div class="pushpin"></div>
                <div class="notice-content-area">
                    ${priority === 'urgent' ? '<div class="priority-banner banner-urgent">🚨 URGENT NOTICE</div>' : ''}
                    ${priority === 'important' ? '<div class="priority-banner banner-important">⚠️ IMPORTANT</div>' : ''}
                    ${notice.image ? `
                        <div class="banner-container" id="bannerWrapper">
                            <div class="banner-bg-fill" style="background-image: url('${notice.image}');"></div>
                            <img src="${notice.image}" class="notice-img">
                        </div>` : ''}
                    <h3>${escapeHeading(notice.heading || '')}</h3>
                    <div class="notice-body-content" id="slideContent"></div>
                </div>
                <div class="notice-footer">
                    <span>${currentIndex + 1}/${visibleNotices.length}</span>
                    <span class="author-badge">👤 ${escapeHeading(notice.addedBy || 'Admin')}</span>
                </div>`;
            wrapper.appendChild(card);

            if (notice.image) {
                const imgCheck = new Image();
                imgCheck.onload = function() {
                    const aspectRatio = imgCheck.naturalWidth / imgCheck.naturalHeight;
                    const containerEl = card.querySelector('#bannerWrapper');
                    if (containerEl && (aspectRatio < 2.2 || aspectRatio > 3.1)) {
                        containerEl.classList.add('has-blur');
                    }
                };
                imgCheck.src = notice.image;
            }

            const contentDiv = card.querySelector('#slideContent');
            if ((notice.content || '').includes('<') && (notice.content || '').includes('>')) {
                contentDiv.innerHTML = notice.content;
            } else {
                contentDiv.textContent = notice.content || '';
            }

            visibleNotices.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `dot ${idx === currentIndex ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            });

            const textLength = contentDiv.innerText.length || 50;
            let duration = Math.min(Math.max(12000 + Math.floor(textLength / 150) * 3000, 12000), 25000);

            setTimeout(() => {
                if (contentDiv.scrollHeight > contentDiv.clientHeight) {
                    let currentScroll = 0;
                    const maxScroll = contentDiv.scrollHeight - contentDiv.clientHeight;
                    const step = maxScroll / (duration / 50);
                    autoScrollInterval = setInterval(() => {
                        if (currentScroll < maxScroll) {
                            currentScroll += step;
                            contentDiv.scrollTop = currentScroll;
                        }
                    }, 50);
                }
            }, 400);

            const increment = (50 / duration) * 100;
            progressInterval = setInterval(() => {
                progressWidth = Math.min(progressWidth + increment, 100);
                if (progressBar) progressBar.style.width = progressWidth + '%';
            }, 50);

            slideTimeout = setTimeout(() => {
                currentIndex = (currentIndex + 1) % visibleNotices.length;
                renderCurrentNotice();
            }, duration);
        }

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function escapeHeading(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
