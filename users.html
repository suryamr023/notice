<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Portal Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-content-wrapper { flex-grow: 1; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-link { color: var(--primary); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .nav-link:hover { text-decoration: underline; }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1, h2 { color: var(--text-main); font-weight: 800; }

        .btn-primary { 
            background: var(--primary); color: white; border: none; 
            padding: 12px 20px; border-radius: 8px; cursor: pointer; 
            font-weight: 700; font-size: 14px; transition: background 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        #userModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }

        .modal-content {
            background: #ffffff; width: 100%; max-width: 500px;
            padding: 25px; border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); border: 1px solid var(--border);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.88rem; color: #475569; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #f8fafc; }
        input:focus, select:focus { outline: 2px solid var(--primary); background: #fff; }

        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; flex: 1; }

        .users-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: #ffffff; border-radius: 14px; padding: 20px;
            border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .user-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .user-card h3 { font-size: 1.1rem; color: var(--text-main); font-weight: 800; }
        .user-card p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }

        .badge { padding: 4px 10px; font-size: 10px; font-weight: 800; border-radius: 6px; color: white; text-transform: uppercase; }
        .badge-admin { background: #6366f1; }
        .badge-publisher { background: #0284c7; }

        .user-card-actions { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; display: flex; gap: 8px; }
        .action-btn { padding: 8px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; flex: 1; }
        .edit-btn { background: #e0f2fe; color: #0369a1; }
        .delete-btn { background: #fee2e2; color: #b91c1c; }

        #accessDenied { display: none; text-align: center; padding: 80px 20px; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .site-footer {
            text-align: center; padding: 25px 0 15px 0; font-size: 0.85rem;
            color: var(--text-muted); font-weight: 600; border-top: 1px solid var(--border); margin-top: 40px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .header-section { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="main-content-wrapper">
        <div class="top-bar">
            <a href="https://suryamr023.github.io/notice/" class="nav-link">⬅ Back to Notice Management</a>
            <span id="loggedInAs" style="font-weight: 700; color: var(--text-muted); font-size: 0.9rem;"></span>
        </div>

        <div id="mainContent">
            <div class="header-section">
                <h2>👥 Active Portal Accounts</h2>
                <button class="btn-primary" onclick="window.openAddModal()">+ Add New User</button>
            </div>

            <div class="users-list" id="usersGridContainer"></div>
        </div>

        <div id="userModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Create New User</h2>
                    <button class="close-modal" onclick="window.closeModal()">✕</button>
                </div>
                
                <div class="form-group">
                    <label for="newUsername">Username (Login ID)</label>
                    <input type="text" id="newUsername" placeholder="e.g. alex_admin">
                </div>
                <div class="form-group">
                    <label for="newFullName">Full Name / Department</label>
                    <input type="text" id="newFullName" placeholder="e.g. Alex (Maintenance)">
                </div>
                <div class="form-group">
                    <label for="newPassword">Password</label>
                    <input type="text" id="newPassword" placeholder="Enter secure password">
                </div>
                <div class="form-group">
                    <label for="newRole">Role Permission</label>
                    <select id="newRole">
                        <option value="publisher">Publisher</option>
                        <option value="admin">Master Admin</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button class="btn-secondary" onclick="window.closeModal()">Cancel</button>
                    <button class="btn-primary" id="submitUserBtn" onclick="window.saveUserAccount()">Create Account</button>
                </div>
            </div>
        </div>

        <div id="accessDenied" style="display:none;" class="card">
            <h2 style="color: #dc2626; margin-bottom: 10px;">⛔ Access Denied</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Only Master Administrator can manage accounts.</p>
            <a href="https://suryamr023.github.io/notice/" class="btn-primary" style="display:inline-block; text-decoration:none; width:auto; padding:10px 25px;">Return</a>
        </div>
    </div>

    <footer class="site-footer">
        © 2026 Surya M R. All rights reserved.
    </footer>

    <!-- Firebase Realtime Database SDK Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBeUXbdADiVfaoxpYULCx6jv9yj8p7klHI",
            authDomain: "notes-b78bf.firebaseapp.com",
            databaseURL: "https://notes-b78bf-default-rtdb.firebaseio.com",
            projectId: "notes-b78bf",
            storageBucket: "notes-b78bf.firebasestorage.app",
            messagingSenderId: "19853194702",
            appId: "1:19853194702:web:9603d20b0e6ec91684e79f",
            measurementId: "G-TC8WNNDX1K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const currentUser = JSON.parse(sessionStorage.getItem('activeUser')) || null;
        let editingUsername = null;
        let globalUsers = {};

        window.onload = function() {
            if (!currentUser || currentUser.role !== 'admin') {
                const mainContent = document.getElementById('mainContent');
                const accessDenied = document.getElementById('accessDenied');
                if (mainContent) mainContent.style.display = 'none';
                if (accessDenied) accessDenied.style.display = 'block';
            } else {
                const loggedInAs = document.getElementById('loggedInAs');
                if (loggedInAs) loggedInAs.innerText = `Logged in: ${currentUser.name}`;

                // Sync users from Firebase Cloud Database
                onValue(ref(db, 'users'), (snapshot) => {
                    const data = snapshot.val();
                    if (!data) {
                        // Initialize default Master Admin if database is empty
                        const defaultUsers = { "surya": { pass: "0203", role: "admin", name: "Surya (Master Admin)" } };
                        set(ref(db, 'users'), defaultUsers);
                    } else {
                        globalUsers = data;
                        renderUsersGrid();
                    }
                });
            }
        }

        function renderUsersGrid() {
            const container = document.getElementById('usersGridContainer');
            if (!container) return;
            container.innerHTML = '';

            for (let username in globalUsers) {
                const user = globalUsers[username];
                const card = document.createElement('div');
                card.className = 'user-card';
                
                let actionsHTML = `<button class="action-btn edit-btn" onclick="window.editUser('${username}')">Edit</button>`;
                if (username !== 'surya') {
                    actionsHTML += `<button class="action-btn delete-btn" onclick="window.deleteUser('${username}')">Delete</button>`;
                } else {
                    actionsHTML += `<span style="color:#94a3b8; font-size:11px; padding:6px; text-align:center; flex:1;">Protected</span>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="user-card-header">
                            <h3>${escapeHTML(username)}</h3>
                            <span class="badge badge-${escapeHTML(user.role)}">${escapeHTML(user.role)}</span>
                        </div>
                        <p><strong>Name:</strong> ${escapeHTML(user.name)}</p>
                        <p><strong>Password:</strong> <code>${escapeHTML(user.pass)}</code></p>
                    </div>
                    <div class="user-card-actions">${actionsHTML}</div>
                `;
                container.appendChild(card);
            }
        }

        window.openAddModal = function() {
            editingUsername = null;
            document.getElementById('modalTitle').innerText = '👥 Create New User';
            document.getElementById('submitUserBtn').innerText = 'Create Account';
            document.getElementById('newUsername').value = '';
            document.getElementById('newFullName').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('newRole').value = 'publisher';
            document.getElementById('userModal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('userModal').style.display = 'none';
        }

        window.saveUserAccount = function() {
            const uname = document.getElementById('newUsername').value.trim().toLowerCase();
            const fullName = document.getElementById('newFullName').value.trim();
            const pass = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newRole').value;

            if (!uname || !fullName || !pass) { alert("Please fill out all fields."); return; }

            let users = { ...globalUsers };

            if (editingUsername === null) {
                if (users[uname]) { alert("Username already exists!"); return; }
                users[uname] = { pass: pass, role: role, name: fullName };
            } else {
                if (uname !== editingUsername && users[uname]) { alert("Username already exists!"); return; }
                if (uname !== editingUsername) delete users[editingUsername];
                users[uname] = { pass: pass, role: role, name: fullName };
            }

            set(ref(db, 'users'), users).then(() => {
                window.closeModal();
            }).catch((err) => {
                alert("Error saving user: " + err.message);
            });
        }

        window.editUser = function(username) {
            const user = globalUsers[username];
            if (!user) return;
            document.getElementById('newUsername').value = username;
            document.getElementById('newFullName').value = user.name;
            document.getElementById('newPassword').value = user.pass;
            document.getElementById('newRole').value = user.role;
            editingUsername = username;
            document.getElementById('modalTitle').innerText = `✏️ Edit User`;
            document.getElementById('submitUserBtn').innerText = 'Update Account';
            document.getElementById('userModal').style.display = 'flex';
        }

        window.deleteUser = function(username) {
            if (username === 'surya') { alert("Cannot delete Master Admin!"); return; }
            if (confirm(`Delete login ID '${username}'?`)) {
                let users = { ...globalUsers };
                delete users[username];
                set(ref(db, 'users'), users);
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
